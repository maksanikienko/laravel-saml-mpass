name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: 10, testbench: 8,  php: '8.1' }
          - { laravel: 10, testbench: 8,  php: '8.3' }
          - { laravel: 11, testbench: 9,  php: '8.2' }
          - { laravel: 11, testbench: 9,  php: '8.4' }
          - { laravel: 12, testbench: 10, php: '8.2' }
          - { laravel: 12, testbench: 10, php: '8.4' }
          - { laravel: 13, testbench: 11, php: '8.3' }
          - { laravel: 13, testbench: 11, php: '8.5' }

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, openssl, zlib
          coverage: none

      - name: Install dependencies
        run: |
          # EOL Laravel releases carry security advisories that Composer refuses
          # to install by default; they are still needed to test the support range.
          composer config audit.block-insecure false
          composer require "illuminate/support:^${{ matrix.laravel }}.0" --no-update --no-interaction
          composer require "orchestra/testbench:^${{ matrix.testbench }}.0" --dev --no-update --no-interaction
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
